[tool:pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# MVP optimized options - focused on development velocity
addopts =
    -ra
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-branch
    --tb=short
    --maxfail=3
    -p tests.pytest_plugins

# MVP coverage requirements - relaxed for development velocity
min_coverage = 70

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# MVP timeout settings - optimized for quick feedback
timeout = 30
timeout_method = thread

# Register custom markers to avoid warnings
markers =
    # Test priority levels for MVP
    priority(level): Mark test priority (critical, high, medium, low, trivial)

    # Test categories
    category(name): Categorize tests (unit, integration, e2e, performance)
    unit: Mark test as unit test
    integration: Mark test as integration test
    e2e: Mark test as end-to-end test

    # MVP-specific test types
    smoke: Mark test as smoke test for quick validation (MVP essential)
    mvp: Mark test as MVP essential
    post_mvp: Mark test for post-MVP implementation
    slow: Mark test as slow (>2s execution time)
    flaky: Mark test as potentially flaky (skip in MVP)
    quick: Mark test as quick validation (<1s)

    # Performance testing
    performance(max_duration=X): Mark performance-sensitive tests with threshold
    benchmark: Mark test for benchmarking

    # Feature requirements
    requires(feature): Mark tests requiring specific features or services
    requires_redis: Test requires Redis connection
    requires_db: Test requires database connection
    requires_network: Test requires network access

    # WebSocket testing
    websocket: Mark test as WebSocket test
    realtime: Mark test for real-time functionality

    # Domain-specific markers
    domain: Mark domain layer tests
    application: Mark application layer tests
    infrastructure: Mark infrastructure layer tests
    presentation: Mark presentation layer tests

    # MVP test execution control
    skip_mvp: Skip test in MVP development
    mvp_critical: Critical for MVP - must pass

# Coverage configuration - MVP optimized
[coverage:run]
source = src
branch = True
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */migrations/*
    */alembic/*
    */versions/*

[coverage:report]
# MVP coverage thresholds - relaxed for development velocity
fail_under = 70
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if False:
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @(abc\.)?abstractmethod
    @overload

[coverage:html]
directory = htmlcov

# Logging configuration for tests - MVP optimized
[tool:pytest:logging]
log_cli = false
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)8s] [%(name)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# MVP test groups for quick testing
[tool:pytest:custom_groups]
# MVP essential test groups
mvp = -m "mvp or smoke or priority('critical')"
smoke = -m "smoke"
critical = -m "priority('critical') and not slow and not flaky"
quick = -m "quick or (smoke and not slow)"
essential = -m "(priority('critical') or priority('high')) and not post_mvp and not flaky"

# Development-focused groups
fast = -m "not slow and not e2e and not performance and not flaky"
unit_only = -m "unit and not slow"
integration_only = -m "integration and not slow and not flaky"
e2e_essential = -m "e2e and (smoke or priority('critical')) and not flaky"

# CI/CD groups
ci = -m "not skip_mvp and not flaky and not post_mvp"
pre_commit = -m "(smoke or quick) and not slow"
deployment = -m "mvp_critical or (smoke and e2e)"

# Post-MVP groups (for future implementation)
post_mvp = -m "post_mvp"
performance_tests = -m "performance or benchmark"
stress_tests = -m "slow and performance"
